<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #f2f2f2;
    font-family: Arial, sans-serif;
}

.login{
    width: 350px;
    padding: 30px;
    background-color: white;
    border-radius: 10px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}

.login h2 {
    text-align: center;
    margin-bottom: 25px;
}

.login input {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.login button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 5px;
    background-color: #222;
    color: white;
    cursor: pointer;
}

.login button:hover {
    background-color: #444;
}

.login p {
    text-align: center;
    margin-top: 20px;
}

.login a {
    color: blue;
    text-decoration: none;
}

    </style>

</head>
<body>

   
    <div class="login">
         <h2>Login</h2>
        <form action="">
            <input type="text" placeholder="Enter you username">

            <input type="password" placeholder="Enter your password">

            <button>Login</button>

            <p>Dont have an account? <a href="#">Register</a></p>
        </form>
    </div>
</body>
</html>
